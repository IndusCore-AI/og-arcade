# Every Monday just after 00:00 UTC: last week's OG goes into the hall of fame
# and the board starts the new week (the games' levels change with it).

name: crown

on:
  schedule:
    - cron: '5 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crown last week's OG
        run: |
          git config user.name "og-arcade board"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node scripts/board/board.mjs crown
            git add board README.md
            if git diff --cached --quiet; then break; fi
            git commit -qm "board: a new week"
            if git push -q origin HEAD:main; then break; fi
            sleep $((RANDOM % 6 + 2))
          done
